# Produksiya uchun statik uzatuvchi (`Dockerfile` dagi `prod` bosqichi).
#
# Ishlab chiqishda bu fayl umuman ishlatilmaydi - u yerda Vite ning o'z
# serveri va uning proksisi turadi (`vite.config.ts`).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------- xavfsizlik
    # JWT `localStorage` da turadi, ya'ni ilovaning o'z originida ishga
    # tushgan har qanday begona skript unga yetadi. Yuklanadigan fayllarda
    # bu ikki qatlam bilan yopilgan (`core/uploads.py`, `core/media.py`),
    # lekin ilovaning O'ZIDA uchinchi qatlam yo'q edi.
    #
    # `style-src` da `unsafe-inline` bor: React ba'zi uslublarni element
    # ustiga yozadi. `script-src` da esa YO'Q - eng muhim joyi shu.
    # `connect-src` o'z originiga va WebSocket ga cheklangan.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    # Sayt boshqa saytning ichiga qo'yilmasin (clickjacking).
    add_header X-Frame-Options "DENY" always;

    # Yig'ilgan fayl nomida uning mazmuni xeshi bor (`app-a1b2c3.js`) -
    # mazmun o'zgarsa nom ham o'zgaradi. Shuning uchun ularni uzoq muddatga
    # keshlash xavfsiz.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # `index.html` KESHLANMAYDI. U har yig'ilishda yangi fayl nomlarini
    # ko'rsatadi - eski nusxa keshda qolsa, brauzer allaqachon yo'q
    # bo'lgan `app-eski.js` ni so'rab, oq ekran ko'rsatardi.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API, media va WebSocket backendga o'tadi. Ishlab chiqishdagi Vite
    # proksisi bilan bir xil manzillar - frontend kodi o'zgarmaydi.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Tezlik cheklovi (throttling) haqiqiy IP bo'yicha sanalsin.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Fayl yuklash: 25 MB chegara serverda (`core/uploads.py`) -
        # nginx undan oldin kesib tashlamasin.
        client_max_body_size 26m;
    }

    location /media/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /django-admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # WebSocket: bildirishnoma va chat. `Upgrade` sarlavhalari bo'lmasa
    # ulanish oddiy HTTP so'rovi bo'lib qolar va darrov uzilardi.
    location /ws/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Soket soatlab ochiq turadi - standart 60 soniyalik jimlik
        # chegarasi uni uzib qo'yardi.
        proxy_read_timeout 3600s;
    }

    # Marshrutlash brauzer tomonda (react-router). Har qanday boshqa yo'l
    # `index.html` ga tushadi, aks holda sahifani yangilagan odam 404 olardi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
