# Konteyner jurnallari STANDARTDA cheksiz o'sadi: `json-file` drayveri
# hech qachon kesmaydi va bir necha oy ishlagan dev muhitida diskni
# to'ldirib qo'yadi - shundan keyin Db2 yozolmay qoladi va "docker
# ishlamayapti" bo'ladi. Har servisga bir xil chegara: 3 x 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------- IBM Db2
  # Db2 konteyneri "og'ir": ~3 GB, privileged rejim va yadro sozlamalarini
  # talab qiladi, birinchi ishga tushishi bir necha daqiqa davom etadi
  # (instans, baza va jurnal fayllari yaratiladi). Shuning uchun healthcheck
  # da start_period uzun qo'yilgan.
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: teamflow_db2
    privileged: true                 # Db2 yadro parametrlarini o'zi sozlaydi
    environment:
      LICENSE: accept                # IBM Db2 Community Edition litsenziyasi
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-teamflow}
      DBNAME: ${DB2_DB:-TEAMFLOW}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      PERSISTENT_HOME: "true"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - db2data:/database
      # Instans BIRINCHI marta yaratilganda obraz shu papkadagi hamma
      # skriptni yuguradi. Jurnal hajmi va xotira chegarasi shu yerda -
      # `docker/db2/10-teamflow-tuning.sh` ga qara.
      - ./docker/db2:/var/custom:ro
    ports:
      - "50000:50000"
    # Db2 ga umumiy xotira (shared memory) kerak; standart 64 MB unga kam.
    shm_size: 1gb
    # Db2 ko'p fayl ochadi: har jadval va indeks uchun alohida.
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    # Chegara Db2 ning O'Z chegarasidan (INSTANCE_MEMORY = 2.5 GB) yuqori:
    # Db2 avval o'zini tiyadi, cgroup qotiliga yetib bormaydi. Tartib
    # muhim - teskarisi bo'lsa Db2 xotira so'rayverib OOM da o'ldirilardi.
    mem_limit: 3g
    healthcheck:
      # Baza haqiqatan ulanishga tayyor bo'lgandagina "healthy" bo'ladi.
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_DB:-TEAMFLOW}' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 480s
    restart: unless-stopped
    logging: *logging
    networks: [teamflow]

  # ---------------------------------------------------------- Kanal qatlami (real-time)
  redis:
    image: redis:7-alpine
    container_name: teamflow_redis
    command: >
      redis-server --save "" --appendonly no
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
    networks: [teamflow]

  # ---------------------------------------------------------- Backend: Django REST API
  backend:
    build: ./backend
    container_name: teamflow_backend
    env_file:
      - ./backend/.env
    depends_on:
      db2:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8010:8000"
    # Frontend `depends_on: backend` bilan kutadi - lekin "ishga tushdi"
    # degani "javob bermoqda" degani emas: entrypoint avval migratsiya va
    # `collectstatic` ni bajaradi, bu esa bir necha o'n soniya. Healthcheck
    # bo'lmasa Vite proxy shu vaqt ichida 502 qaytarardi.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/ui-texts/ -o /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s
    # 1 GB KAM edi: shu konteynerda `manage.py test` va migratsiyalar ham
    # yuguradi va katta hajmli sinovda jarayon OOM bilan o'ldirilgan
    # (exit 137). Chegaralar SHIFT, ya'ni band qilinadigan xotira emas -
    # odatdagi ishda backend baribir ~200 MB da turadi.
    mem_limit: 2g
    restart: unless-stopped
    logging: *logging
    networks: [teamflow]

  # ---------------------------------------------------------- Telegram boti
  # Alohida jarayon: bot Telegramga uzoq so'rov (long polling) yuborib
  # turadi va javobni 25 soniya kutadi. Uni web serverga qo'shib bo'lmaydi -
  # u yerda so'rov kelganda ishlaydi, bu yerda esa doim tinglab turishi kerak.
  #
  # Token qo'yilmagan bo'lsa buyruq darrov to'xtaydi va konteyner qayta
  # urinaveradi - shuning uchun `restart` ataylab `on-failure:3`: ilova
  # ishlayveradi, log esa to'lib ketmaydi.
  telegram:
    build: ./backend
    container_name: teamflow_telegram
    command: python manage.py telegram_bot
    env_file:
      - ./backend/.env
    depends_on:
      db2:
        condition: service_healthy
    volumes:
      - ./backend:/app
    mem_limit: 512m
    restart: on-failure:3
    logging: *logging
    networks: [teamflow]

  # ---------------------------------------------------------- Frontend: React + TypeScript
  # Ishlab chiqish rejimi: Vite serveri, kod o'zgarishi darrov ko'rinadi.
  # Serverga chiqarish uchun boshqa bosqich bor - `frontend/Dockerfile`
  # dagi `prod` (nginx + yig'ilgan statik fayllar):
  #   docker build --target prod -t teamflow-web ./frontend
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: teamflow_frontend
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5183:5173"
    mem_limit: 1g
    restart: unless-stopped
    logging: *logging
    networks: [teamflow]

volumes:
  db2data:
  backend_static:
  backend_media:

networks:
  teamflow:
    driver: bridge
