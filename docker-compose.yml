services:
  # ---------------------------------------------------------- Ma'lumotlar bazasi
  db:
    image: postgres:16-alpine
    container_name: teamflow_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamflow}
      POSTGRES_USER: ${POSTGRES_USER:-teamflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teamflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-teamflow} -d ${POSTGRES_DB:-teamflow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5443:5432"
    restart: unless-stopped
    networks: [teamflow]

  # ---------------------------------------------------------- IBM Db2
  # Db2 konteyneri "og'ir": ~3 GB, privileged rejim va yadro sozlamalarini
  # talab qiladi, birinchi ishga tushishi bir necha daqiqa davom etadi
  # (instans, baza va jurnal fayllari yaratiladi). Shuning uchun healthcheck
  # da start_period uzun qo'yilgan.
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: teamflow_db2
    privileged: true                 # Db2 yadro parametrlarini o'zi sozlaydi
    environment:
      LICENSE: accept                # IBM Db2 Community Edition litsenziyasi
      DB2INST1_PASSWORD: ${DB2_PASSWORD:-teamflow}
      DBNAME: ${DB2_DB:-TEAMFLOW}
      BLU: "false"
      ENABLE_ORACLE_COMPATIBILITY: "false"
      PERSISTENT_HOME: "true"
      ARCHIVE_LOGS: "false"
      AUTOCONFIG: "false"
    volumes:
      - db2data:/database
    ports:
      - "50000:50000"
    healthcheck:
      # Baza haqiqatan ulanishga tayyor bo'lgandagina "healthy" bo'ladi.
      test: ["CMD-SHELL", "su - db2inst1 -c 'db2 connect to ${DB2_DB:-TEAMFLOW}' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 480s
    restart: unless-stopped
    networks: [teamflow]

  # ---------------------------------------------------------- Kanal qatlami (real-time)
  redis:
    image: redis:7-alpine
    container_name: teamflow_redis
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [teamflow]

  # ---------------------------------------------------------- Backend: Django REST API
  backend:
    build: ./backend
    container_name: teamflow_backend
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      db2:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_static:/app/staticfiles
      - backend_media:/app/media
    ports:
      - "8010:8000"
    restart: unless-stopped
    networks: [teamflow]

  # ---------------------------------------------------------- Frontend: React + TypeScript
  frontend:
    build: ./frontend
    container_name: teamflow_frontend
    environment:
      VITE_API_URL: /api
      VITE_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5183:5173"
    restart: unless-stopped
    networks: [teamflow]

volumes:
  pgdata:
  db2data:
  backend_static:
  backend_media:

networks:
  teamflow:
    driver: bridge
